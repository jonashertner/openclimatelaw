services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: openclimate
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: openclimate
    ports:
      - "5432:5432"
    volumes:
      - openclimate-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclimate -d openclimate"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  openclimate-pg:
